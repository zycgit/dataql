# Standalone example; command-line properties may override these values.
server.host=127.0.0.1
server.port=8080
server.http.coreThreads=2
dataway.api-enabled=true
dataway.api-prefix=/api
dataway.admin-enabled=true
dataway.admin-prefix=/admin/api
dataway.admin-ui=/admin
dataway.docs-enabled=true
dataway.docs-prefix=/docs
# Empty creates a random signing key for this application instance.
example.jwt.secret=
example.jwt.expiration-seconds=900
example.database.main.url=jdbc:h2:mem:dataway-solon-main
example.database.main.username=sa
example.database.main.password=
example.database.ds1.url=jdbc:h2:mem:dataway-solon-ds1
example.database.ds1.username=sa
example.database.ds1.password=
example.database.ds2.url=jdbc:h2:mem:dataway-solon-ds2
example.database.ds2.username=sa
example.database.ds2.password=

# Change to nacos to store API metadata in the configured Nacos instance.
example.metadata=jdbc
example.nacos.server-addr=127.0.0.1:8848
example.nacos.namespace=
example.nacos.username=
example.nacos.password=
example.nacos.group=DATAWAY_EXAMPLE
example.nacos.data-id=dataway-solon-example
example.upload.directory=./target/uploads
example.upload.memory-threshold=65536
server.request.maxFileSize=10mb
server.request.maxBodySize=12mb
