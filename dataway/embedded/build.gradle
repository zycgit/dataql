plugins {
    id 'java-library'
    id 'maven-publish'
}

ext.pomName = 'Dataway Embedded'
description = 'Framework-independent embedded Dataway runtime, persistence and HTTP handlers.'

dependencies {
    api project(':dataql-engine')
    api project(':dataway-embedded-web')

    testImplementation 'org.mockito:mockito-core:5.23.0'
}
