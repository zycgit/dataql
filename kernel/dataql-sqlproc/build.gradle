plugins {
    id 'java-library'
    id 'dataql.central-publish'
    id 'com.gradleup.shadow'
}

ext.pomName = 'DataQL SQL Execute'
description = 'The hasor DataQL SQL procedure project.'

configurations {
    shaded
}

dependencies {
    api project(':dataql-engine')
    shaded 'ognl:ognl:3.4.3'

    compileOnly 'ognl:ognl:3.4.3'
    compileOnly 'com.alibaba:fastjson:2.0.53'
    compileOnly 'com.alibaba.fastjson2:fastjson2:2.0.53'
    compileOnly 'com.google.code.gson:gson:2.11.0'
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.18.0'

    testImplementation "net.hasor:dbvisitor:${property('lib.dbvisitor')}"
    testImplementation 'ognl:ognl:3.4.3'
    testImplementation 'com.alibaba:fastjson:2.0.53'
    testImplementation 'com.alibaba.fastjson2:fastjson2:2.0.53'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.0'
    testImplementation 'com.alibaba:druid:1.2.11'
    testImplementation "com.h2database:h2:${property('lib.h2')}"
    testImplementation 'mysql:mysql-connector-java:8.0.29'
    testImplementation 'org.postgresql:postgresql:42.3.6'
    testImplementation 'com.oracle.database.jdbc:ojdbc8:21.5.0.0'
    testImplementation 'com.oracle.database.xml:xdb:21.5.0.0'
    testImplementation 'com.oracle.database.xml:xmlparserv2:21.5.0.0'
}

tasks.named('shadowJar') {
    configurations = [project.configurations.shaded]
    relocate 'ognl', 'net.hasor.dataql.sqlproc.jars.ognl'
    relocate 'javassist', 'net.hasor.dataql.sqlproc.jars.javassist'
    exclude 'META-INF/maven/ognl/**'
    exclude 'META-INF/maven/org.javassist/**'
}
