<svg xmlns="http://www.w3.org/2000/svg" width="690" height="495" viewBox="0 0 920 660" role="img" aria-labelledby="title description">
  <title id="title">Management and API request flow</title>
  <desc id="description">After routing and identity resolution, management requests pass authorization, admin interceptors, Controllers and AdminService. API calls find a release, compile it and execute through API interceptors. Console debugging uses the execution engine. The shared handler writes responses and cleans uploads.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #203047; }
    .heading { font-size: 22px; font-weight: 600; }
    .label { font-size: 20px; }
    .detail { font-size: 18px; fill: #526176; }
    .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="920" height="660" fill="#ffffff"/>
  <rect x="116" y="24" width="688" height="64" rx="10" fill="#eef4ff" stroke="#bfd0ef"/>
  <text x="460" y="63" class="heading" text-anchor="middle">HTTP request</text>
  <path d="M 460 88 V 124" class="line"/>
  <rect x="116" y="124" width="688" height="64" rx="10" fill="#f8fafc" stroke="#d4dde8"/>
  <text x="460" y="163" class="label" text-anchor="middle">WebRequest / WebResponse</text>
  <path d="M 460 188 V 208 H 222 V 228" class="line"/>
  <path d="M 460 208 H 698 V 228" class="line"/>
  <rect x="32" y="228" width="380" height="68" rx="10" fill="#e9f5f2" stroke="#beded4"/>
  <text x="222" y="269" class="label" text-anchor="middle">Management request</text>
  <path d="M 222 296 V 330" class="line"/>
  <rect x="32" y="330" width="380" height="68" rx="10" fill="#e9f5f2" stroke="#beded4"/>
  <text x="222" y="371" class="label" text-anchor="middle">Controller</text>
  <path d="M 222 398 V 432" class="line"/>
  <rect x="32" y="432" width="380" height="68" rx="10" fill="#e9f5f2" stroke="#beded4"/>
  <text x="222" y="473" class="label" text-anchor="middle">AdminService</text>
  <rect x="508" y="228" width="380" height="68" rx="10" fill="#eef4ff" stroke="#bfd0ef"/>
  <text x="698" y="269" class="label" text-anchor="middle">Business API request</text>
  <path d="M 698 296 V 330" class="line"/>
  <rect x="508" y="330" width="380" height="68" rx="10" fill="#eef4ff" stroke="#bfd0ef"/>
  <text x="698" y="371" class="label" text-anchor="middle">DatawayEngine</text>
  <path d="M 698 398 V 432" class="line"/>
  <rect x="508" y="432" width="380" height="68" rx="10" fill="#eef4ff" stroke="#bfd0ef"/>
  <text x="698" y="473" class="label" text-anchor="middle">DatawayQuery</text>
  <path d="M 412 364 H 508" class="line" stroke-dasharray="6 4"/>
  <text x="460" y="349" class="detail" text-anchor="middle">Debug</text>
  <path d="M 222 500 V 542 H 460 V 568" class="line"/>
  <path d="M 698 500 V 542 H 460" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="116" y="568" width="688" height="68" rx="10" fill="#f8fafc" stroke="#d4dde8"/>
  <text x="460" y="609" class="label" text-anchor="middle">Shared WebHandler</text>
</svg>
