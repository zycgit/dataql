plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    api project(':dataway-embedded')
    api 'org.noear:solon:4.1.0'
    implementation 'org.noear:solon-handle:4.1.0'

    // optional
    compileOnly project(':dataql-sqlproc')
    compileOnly project(':dataway-meta-jdbc')
    compileOnly 'org.noear:solon-data:4.1.0'

    // for test
    testImplementation project(path: ':dataql-sqlproc', configuration: 'shadow')
    testImplementation project(':dataway-meta-jdbc')
    testImplementation 'org.noear:solon-data:4.1.0'
    testImplementation 'com.h2database:h2:2.5.250'
    testImplementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    testImplementation 'org.noear:solon-server-smarthttp:4.1.0'
    testImplementation 'com.squareup.okhttp3:okhttp-jvm:5.3.2'
}
