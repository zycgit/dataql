# Complete override configuration, loaded through Solon Props.
#
# Published business API.
dataway.api-enabled=true
dataway.api-prefix=/open/v2
dataway.admin-enabled=true
dataway.admin-prefix=/ops/manage
# Management UI path; enabled together with the management API.
dataway.admin-ui=/tools/console
# Metadata selection; transaction-manager is only used by Spring.
dataway.metadata.type=jdbc
dataway.metadata.bean=
dataway.metadata.jdbc.executor=
dataway.metadata.jdbc.data-source=metadataSource
dataway.metadata.jdbc.transaction-manager=metadataTransactionManager
dataway.metadata.jdbc.table-prefix=dw_
dataway.metadata.nacos.config-service=metadataClient
dataway.metadata.nacos.data-id=host-store
dataway.metadata.nacos.group=HOST_GROUP
dataway.metadata.nacos.timeout-millis=1500
