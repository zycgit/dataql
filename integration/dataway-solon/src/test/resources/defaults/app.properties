# Complete built-in defaults shared by Spring, Hasor and Solon.
# Both features are disabled; no datasource is resolved until API or management is enabled.
# Published business API.
dataway.api-enabled=false
dataway.api-prefix=/api
dataway.admin-enabled=false
dataway.admin-prefix=/dataway/api
# Management UI path; enabled together with the management API.
dataway.admin-ui=/dataway
# Metadata selection; transaction-manager is only used by Spring.
dataway.metadata.type=
dataway.metadata.bean=
dataway.metadata.jdbc.executor=
dataway.metadata.jdbc.data-source=
dataway.metadata.jdbc.transaction-manager=
dataway.metadata.jdbc.table-prefix=
dataway.metadata.nacos.config-service=
dataway.metadata.nacos.data-id=dataway-store.json
dataway.metadata.nacos.group=HASOR_DATAWAY
dataway.metadata.nacos.timeout-millis=3000
