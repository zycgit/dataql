# Complete Dataway options; loaded through Spring YAML configuration.
dataway:
  api-enabled: false
  api-prefix: "/api"
  admin-enabled: false
  admin-prefix: "/dataway/api"
  admin-ui: "/dataway"
  docs-enabled: false
  docs-prefix: "/dataway/docs"
  metadata:
    bean: ""
