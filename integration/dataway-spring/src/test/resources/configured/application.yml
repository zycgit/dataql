# Complete Dataway options; loaded through Spring YAML configuration.
dataway:
  api-enabled: true
  api-prefix: "/open/v2"
  admin-enabled: true
  admin-prefix: "/ops/manage"
  admin-ui: "/tools/console"
  metadata:
    type: "jdbc"
    bean: ""
    jdbc:
      executor: ""
      data-source: "metadataSource"
      transaction-manager: "metadataTransactionManager"
      table-prefix: "dw_"
    nacos:
      config-service: "metadataClient"
      data-id: "host-store"
      group: "HOST_GROUP"
      timeout-millis: "1500"
