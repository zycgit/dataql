plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    api project(':dataway-embedded')
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.1')

    // optional
    compileOnly project(':dataway-meta-jdbc')
    compileOnly 'org.springframework:spring-jdbc'

    // for test
    testImplementation project(path: ':dataql-sqlproc', configuration: 'shadow')
    testImplementation 'com.squareup.okhttp3:okhttp-jvm:5.3.2'
    testImplementation project(':dataway-meta-jdbc')
    testImplementation 'org.springframework:spring-jdbc'
    testImplementation 'com.h2database:h2:2.5.250'
    testImplementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
}

// Spring Boot initializes its logging system with the starter's Logback provider.
configurations.testRuntimeClasspath {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}
